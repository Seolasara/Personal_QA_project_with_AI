[pytest]
# 테스트는 이 디렉토리(api-demo/)를 rootdir로 실행한다.
#   .venv/bin/pytest
#   .venv/bin/pytest -m api      # API 테스트 전체
#   .venv/bin/pytest -m tc       # TC 연결된 테스트만

addopts =
    --json-report
    --json-report-file=test-results/report.json
    --html=test-results/report.html
    --self-contained-html
    # 연결 단계 실패(요청이 서버에 닿지 않음)만 최대 2회 재시도. ReadTimeout은 쓰기 요청이 처리됐을 수 있어 제외(2026-10-13 사용자 결정)
    --reruns=2
    --only-rerun=ConnectTimeout
    --only-rerun=ConnectError

markers =
    tc(id): 연결된 테스트케이스 ID. 예) @pytest.mark.tc("API_01")
    spec_undefined: 스펙에 정확한 기대결과가 없는 TC. /test-run 전체 실행에서 뺀다
    issue(key): Jira에 등록된 결함을 검증하는 테스트. xfail 없이 실패로 집계한다. 예) @pytest.mark.issue("QA-4")
    quarantine: 원인 수리 전까지 격리한 flaky 테스트. CI에서는 결과가 빌드를 막지 않는 별도 단계에서 돌린다
