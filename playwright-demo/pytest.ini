[pytest]
# 테스트는 이 디렉토리(playwright-demo/)를 rootdir로 실행한다.
#   .venv/bin/pytest
#   .venv/bin/pytest -m smoke          # PR 게이트용 빠른 서브셋
#   .venv/bin/pytest -m "tc"            # TC 연결된 테스트만

base_url = https://practicesoftwaretesting.com

addopts =
    --json-report
    --json-report-file=test-results/report.json
    --html=test-results/report.html
    --self-contained-html
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --output=test-results
    # 환경(사이트 지연) 시간 초과만 최대 2회 재시도. 어설션 실패는 재시도하지 않는다(2026-10-13 사용자 결정)
    --reruns=2
    --only-rerun=Page\.goto:\sTimeout
    --only-rerun=Page\.wait_for_url:\sTimeout
    --only-rerun=waiting\sfor\sevent\s.response

markers =
    tc(id): 연결된 테스트케이스 ID. 예) @pytest.mark.tc("UI_12")
    spec_undefined: 스펙에 정확한 기대결과가 없는 TC. /test-run 전체 실행에서 뺀다
    issue(key): Jira에 등록된 결함을 검증하는 테스트. xfail 없이 실패로 집계한다. 예) @pytest.mark.issue("QA-7")
    smoke: PR 게이트에서 돌리는 빠른 스모크 서브셋
